name: Update casks

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh

      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "casks: update $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.rb$//' | paste -sd, -)"
          git push
